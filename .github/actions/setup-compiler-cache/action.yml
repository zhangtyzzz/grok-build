name: Set up shared compiler cache
description: Cache individual compiler results in the existing GitHub Actions allowance

inputs:
  read-only:
    description: Read shared cache objects without writing new ones
    required: false
    default: "false"

outputs:
  enabled:
    description: Whether sccache and its fallback wrapper were configured
    value: ${{ steps.enable.outputs.enabled }}

runs:
  using: composite
  steps:
    - name: Install pinned sccache
      id: sccache
      continue-on-error: true
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      with:
        version: v0.18.0
        disable_annotations: true

    - name: Enable shared compiler cache
      id: enable
      if: steps.sccache.outcome == 'success'
      shell: bash
      env:
        CACHE_RW_MODE: ${{ inputs.read-only == 'true' && 'READ_ONLY' || 'READ_WRITE' }}
      run: |
        set -euo pipefail
        # The pinned setup action exports the short-lived cache service runtime
        # credentials. Never persist them in an artifact or cache archive.
        if [[ -z "${ACTIONS_RESULTS_URL:-}" || -z "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
          echo "Cache service credentials unavailable; compiling without sccache"
          exit 0
        fi
        wrapper="$RUNNER_TEMP/grok-sccache-fallback${{ runner.os == 'Windows' && '.exe' || '' }}"
        rustc scripts/ci/sccache-fallback.rs -o "$wrapper"
        {
          echo "GROK_SCCACHE_BIN=$SCCACHE_PATH"
          echo "RUSTC_WRAPPER=$wrapper"
          echo "SCCACHE_GHA_ENABLED=on"
          echo "SCCACHE_GHA_VERSION=grok-build-v1"
          echo "SCCACHE_GHA_RW_MODE=$CACHE_RW_MODE"
          # A rate-limited capability probe otherwise downgrades the entire
          # server lifetime to read-only. Preserve the explicitly chosen mode.
          echo "SCCACHE_SKIP_CACHE_CHECK=true"
          echo "SCCACHE_ERROR_LOG=$RUNNER_TEMP/grok-sccache-error.log"
          echo "SCCACHE_IDLE_TIMEOUT=0"
        } >>"$GITHUB_ENV"
        echo "enabled=true" >>"$GITHUB_OUTPUT"
