name: Finalize shared compiler cache
description: Stop the compiler cache and persist a bounded public workflow snapshot

inputs:
  enabled:
    description: Whether compiler caching was enabled by the setup action
    required: true
  cache-name:
    description: Artifact name emitted by setup-compiler-cache
    required: true
  save:
    description: Whether this successful branch job may publish a compiler snapshot
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Report and stop compiler cache
      if: inputs.enabled == 'true'
      continue-on-error: true
      shell: bash
      run: |
        set -uo pipefail
        "$GROK_SCCACHE_BIN" --show-stats
        "$GROK_SCCACHE_BIN" --stop-server

    # Public Actions artifacts do not consume the 10 GiB dependency-cache pool.
    # Never opt a private fork into storage charges through this helper.
    - name: Save compiler snapshot
      if: inputs.enabled == 'true' && inputs.save == 'true' && toJSON(github.event.repository.private) == 'false'
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.cache-name }}
        path: ${{ runner.temp }}/grok-sccache
        overwrite: true
        compression-level: 0
        retention-days: 30
        if-no-files-found: warn
