name: Prune superseded build caches

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
      - Release
      - Warm release build cache
      - Publish release (warm, tag, Release)
    types: [completed]
    branches: [main, alpha]
  # Automatic alpha warm runs are dispatched with GITHUB_TOKEN, and GitHub does
  # not raise workflow_run for those, so their ~1.5 GB of per-commit binaries
  # would otherwise wait for the next human-triggered run.
  schedule:
    - cron: "41 */2 * * *"

permissions: {}

concurrency:
  group: cache-maintenance
  cancel-in-progress: false

jobs:
  prune:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
    steps:
      # workflow_run has write permission: execute only the trusted default
      # branch, never code or artifacts supplied by the completed run.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Remove retired archives and superseded source/build snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/ci/prune-caches.py --delete

      - name: Remove superseded compiler snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/ci/compiler-cache-artifact.py prune
