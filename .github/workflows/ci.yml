name: CI

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact commit to validate when called by the upstream sync workflow
        required: false
        default: ""
        type: string
      compiler_cache_read_only:
        description: Prevent a reusable caller from writing compiler cache entries
        required: false
        default: false
        type: boolean
      reuse_successful_ci:
        description: Reuse a successful trusted push/manual CI run for this exact source commit
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "3"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  previous:
    name: Check existing exact-commit CI
    if: inputs.reuse_successful_ci
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.ci.outputs.reuse }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Verify previous successful CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ inputs.checkout_ref || github.sha }}
        run: python3 scripts/ci/release-handoff.py find-ci
  rust:
    needs: previous
    if: >-
      !cancelled() && (needs.previous.result == 'skipped' ||
      (needs.previous.result == 'success' && needs.previous.outputs.reuse != 'true'))
    name: Rust checks and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Resolve the pinned Rust toolchain
        run: |
          set -euo pipefail
          channel="$(awk -F '"' '/^channel = /{ print $2; exit }' rust-toolchain.toml)"
          test -n "$channel"
          echo "RUST_CHANNEL=$channel" >>"$GITHUB_ENV"
          echo "using Rust $channel from rust-toolchain.toml"

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_CHANNEL" --profile minimal --component rustfmt,clippy

      - name: Restore Cargo source cache
        id: cargo-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_CHANNEL }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_CHANNEL }}-

      - name: Set up compiler cache
        id: compiler-cache
        uses: ./.github/actions/setup-compiler-cache
        with:
          namespace: ci-rust
          cache-size: 3G
          read-only: ${{ github.event_name == 'pull_request' || inputs.compiler_cache_read_only }}

      # Shell telemetry tests execute real grep calls. Debug builds otherwise
      # rely on an unpinned (and potentially absent) rg on the runner's PATH.
      - name: Prepare pinned protobuf and search tools
        run: |
          bash scripts/dist/prepare-release-tools.sh \
            --target x86_64-unknown-linux-gnu \
            --output-dir "$RUNNER_TEMP/grok-ci-tools" \
            --github-env "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check changed runtime boundaries
        run: |
          cargo check --locked \
            -p xai-grok-sampling-types \
            -p xai-chat-state \
            -p xai-grok-sampler \
            -p xai-grok-shell \
            -p xai-grok-update

      - name: Run core tests
        run: |
          cargo test --locked \
            -p xai-grok-sampling-types \
            -p xai-chat-state \
            -p xai-grok-sampler \
            -p xai-grok-update

      - name: Run shell tests
        run: cargo test --locked -p xai-grok-shell --lib
        env:
          # Shell turn futures are sized for the production session thread,
          # whose stack budget is 8 MiB. Match it for libtest worker threads.
          RUST_MIN_STACK: "8388608"

      - name: Run focused clippy
        run: |
          cargo clippy --locked --all-targets \
            -p xai-grok-sampling-types \
            -p xai-chat-state \
            -p xai-grok-sampler \
            -p xai-grok-shell \
            -p xai-grok-update

      - name: Save Cargo source cache
        if: success() && github.event_name != 'pull_request' && !inputs.compiler_cache_read_only && steps.cargo-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Finalize compiler cache
        if: always() && steps.compiler-cache.outputs.enabled == 'true'
        uses: ./.github/actions/finalize-compiler-cache
        with:
          enabled: ${{ steps.compiler-cache.outputs.enabled }}
          cache-name: ${{ steps.compiler-cache.outputs.cache-name }}
          save: ${{ job.status != 'cancelled' && github.ref_type == 'branch' && github.event_name != 'pull_request' && !inputs.compiler_cache_read_only }}

  integration:
    needs: previous
    if: >-
      !cancelled() && (needs.previous.result == 'skipped' ||
      (needs.previous.result == 'success' && needs.previous.outputs.reuse != 'true'))
    name: Distribution E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes zip

      - name: Test release handoff trust checks
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: Test release input archive round trip
        run: bash scripts/ci/test-release-inputs.sh

      - name: Test deterministic distribution
        run: bash scripts/dist/test.sh

      - name: Test bounded upstream synchronization
        run: python3 -m unittest discover -s scripts/automation -p 'test_*.py'

  terminal:
    needs: previous
    if: >-
      !cancelled() && (needs.previous.result == 'skipped' ||
      (needs.previous.result == 'success' && needs.previous.outputs.reuse != 'true'))
    name: Terminal, tools, and CLI
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Resolve the pinned Rust toolchain
        run: |
          set -euo pipefail
          channel="$(awk -F '"' '/^channel = /{ print $2; exit }' rust-toolchain.toml)"
          test -n "$channel"
          echo "RUST_CHANNEL=$channel" >>"$GITHUB_ENV"
          echo "using Rust $channel from rust-toolchain.toml"

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_CHANNEL" --profile minimal --component clippy

      - name: Restore Cargo source cache
        id: cargo-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_CHANNEL }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_CHANNEL }}-

      - name: Set up compiler cache
        id: compiler-cache
        uses: ./.github/actions/setup-compiler-cache
        with:
          namespace: ci-terminal
          cache-size: 4G
          read-only: ${{ github.event_name == 'pull_request' || inputs.compiler_cache_read_only }}

      - name: Prepare pinned protobuf and search tools
        run: |
          bash scripts/dist/prepare-release-tools.sh \
            --target x86_64-unknown-linux-gnu \
            --output-dir "$RUNNER_TEMP/grok-terminal-tools" \
            --github-env "$GITHUB_ENV"

      - name: Check terminal composition
        run: |
          cargo check --locked \
            -p xai-grok-tools \
            -p xai-grok-pager \
            -p xai-grok-pager-bin

      - name: Run tool and terminal tests
        run: |
          cargo test --locked -p xai-grok-tools
          cargo test --locked -p xai-grok-pager --lib
          cargo test --locked -p xai-grok-pager-bin

      - name: Clippy terminal composition
        run: |
          cargo clippy --locked --all-targets \
            -p xai-grok-tools \
            -p xai-grok-pager \
            -p xai-grok-pager-bin

      - name: Save Cargo source cache
        if: success() && github.event_name != 'pull_request' && !inputs.compiler_cache_read_only && steps.cargo-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Finalize compiler cache
        if: always() && steps.compiler-cache.outputs.enabled == 'true'
        uses: ./.github/actions/finalize-compiler-cache
        with:
          enabled: ${{ steps.compiler-cache.outputs.enabled }}
          cache-name: ${{ steps.compiler-cache.outputs.cache-name }}
          save: ${{ job.status != 'cancelled' && github.ref_type == 'branch' && github.event_name != 'pull_request' && !inputs.compiler_cache_read_only }}

  windows-protobuf:
    needs: previous
    if: >-
      !cancelled() && (needs.previous.result == 'skipped' ||
      (needs.previous.result == 'success' && needs.previous.outputs.reuse != 'true'))
    name: Windows protobuf build
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Resolve the pinned Rust toolchain
        run: |
          set -euo pipefail
          channel="$(awk -F '"' '/^channel = /{ print $2; exit }' rust-toolchain.toml)"
          test -n "$channel"
          echo "RUST_CHANNEL=$channel" >>"$GITHUB_ENV"
          echo "using Rust $channel from rust-toolchain.toml"

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_CHANNEL" --profile minimal

      - name: Restore Cargo source cache
        id: cargo-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_CHANNEL }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_CHANNEL }}-

      - name: Set up compiler cache
        id: compiler-cache
        uses: ./.github/actions/setup-compiler-cache
        with:
          namespace: ci-windows-protobuf
          cache-size: 512M
          read-only: ${{ github.event_name == 'pull_request' || inputs.compiler_cache_read_only }}

      - name: Test Windows proc-macro reproducibility
        run: pwsh -NoProfile -File scripts/ci/test-windows-repro.ps1

      - name: Test native Windows release input paths
        run: bash scripts/ci/test-release-inputs.sh

      - name: Prepare pinned Windows protobuf compiler
        run: |
          bash scripts/dist/prepare-release-tools.sh \
            --target x86_64-pc-windows-msvc \
            --output-dir "$RUNNER_TEMP/grok-windows-protobuf-tools" \
            --github-env "$GITHUB_ENV" \
            --protoc-only

      - name: Check native Windows protobuf generation
        run: cargo check --locked -p xai-grok-tools-api

      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/crates/codegen/xai-grok-pager/scripts/install.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Test PowerShell installer tagged payload requests
        shell: pwsh
        run: ./scripts/dist/install-powershell.test.ps1

      - name: Save Cargo source cache
        if: success() && github.event_name != 'pull_request' && !inputs.compiler_cache_read_only && steps.cargo-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Finalize compiler cache
        if: always() && steps.compiler-cache.outputs.enabled == 'true'
        uses: ./.github/actions/finalize-compiler-cache
        with:
          enabled: ${{ steps.compiler-cache.outputs.enabled }}
          cache-name: ${{ steps.compiler-cache.outputs.cache-name }}
          save: ${{ job.status != 'cancelled' && github.ref_type == 'branch' && github.event_name != 'pull_request' && !inputs.compiler_cache_read_only }}

  required:
    name: CI required
    if: always()
    needs:
      - previous
      - rust
      - integration
      - terminal
      - windows-protobuf
    runs-on: ubuntu-22.04
    steps:
      - name: Require every CI job
        env:
          REUSED_CI: ${{ needs.previous.result == 'success' && needs.previous.outputs.reuse == 'true' }}
          RUST_RESULT: ${{ needs.rust.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          TERMINAL_RESULT: ${{ needs.terminal.result }}
          WINDOWS_PROTOBUF_RESULT: ${{ needs.windows-protobuf.result }}
        run: |
          if [[ "$REUSED_CI" == true ]]; then
            echo "All gates already passed for this exact source commit"
            exit 0
          fi
          test "$RUST_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$TERMINAL_RESULT" = success
          test "$WINDOWS_PROTOBUF_RESULT" = success
